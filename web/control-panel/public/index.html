<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧庭院 · 控制中心</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
  background: #f5f5f7;
  color: #1d1d1f;
  min-height: 100vh;
}

/* Header */
.header {
  background: rgba(255,255,255,.8);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid #e5e5ea;
  position: sticky;
  top: 0;
  z-index: 50;
}
.header-inner {
  max-width: 960px;
  margin: 0 auto;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.header-logo {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, #34c759, #30d158);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.header-title { font-size: 18px; font-weight: 700; color: #1d1d1f; }
.header-sub { font-size: 11px; color: #86868b; margin-top: 1px; }
.header-right { display: flex; align-items: center; gap: 10px; }
.conn-badge {
  display: flex; align-items: center; gap: 5px;
  font-size: 12px; color: #86868b;
  padding: 4px 12px; border-radius: 20px;
  background: #f0f0f5;
}
.conn-dot { width: 7px; height: 7px; border-radius: 50%; background: #34c759; }
.conn-dot.off { background: #ff3b30; }

/* Container */
.container { max-width: 960px; margin: 0 auto; padding: 20px; }

/* Toolbar */
.toolbar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
}
.toolbar-title { font-size: 15px; font-weight: 600; color: #1d1d1f; }
.toolbar-actions { display: flex; gap: 8px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 7px 16px; border: none; border-radius: 8px;
  font-size: 13px; font-weight: 500; cursor: pointer;
  transition: all .15s;
}
.btn-primary {
  background: #007aff; color: #fff;
}
.btn-primary:hover { background: #0066d6; }
.btn-primary:active { transform: scale(.96); }
.btn-secondary {
  background: #f0f0f5; color: #1d1d1f;
}
.btn-secondary:hover { background: #e5e5ea; }
.btn-secondary:active { transform: scale(.96); }

/* Card */
.card {
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
  border: 1px solid #e5e5ea;
  margin-bottom: 16px;
  overflow: hidden;
}
.card-header {
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #f0f0f5;
}
.card-info { display: flex; align-items: center; gap: 12px; }
.card-avatar {
  width: 40px; height: 40px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  background: #f0f0f5;
}
.card-name { font-size: 16px; font-weight: 600; }
.card-meta { font-size: 11px; color: #86868b; margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; }
.status-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 10px; border-radius: 20px;
  font-size: 11px; font-weight: 500;
}
.status-badge.online { background: #e8f8ee; color: #34c759; }
.status-badge.offline { background: #fce8e8; color: #ff3b30; }

/* Section */
.section { padding: 16px 20px; }
.section + .section { border-top: 1px solid #f0f0f5; }
.section-title {
  font-size: 11px; font-weight: 600; color: #86868b;
  text-transform: uppercase; letter-spacing: .5px;
  margin-bottom: 10px;
}

/* Grid */
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.grid-sensors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 640px) {
  .grid-3 { grid-template-columns: 1fr 1fr; }
  .grid-sensors { grid-template-columns: 1fr 1fr; }
  .container { padding: 12px; }
  .section { padding: 12px 16px; }
}

/* Control item */
.ctrl {
  background: #f9f9fb;
  border-radius: 12px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.ctrl-label { font-size: 13px; font-weight: 500; }
.ctrl-status { font-size: 11px; color: #86868b; margin-top: 2px; }
.ctrl-status.on { color: #34c759; }
.ctrl-status.off { color: #86868b; }

/* Toggle */
.toggle { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle .slider {
  position: absolute; cursor: pointer; inset: 0;
  background: #e5e5ea; border-radius: 24px; transition: .2s;
}
.toggle .slider::before {
  content: ''; position: absolute;
  width: 18px; height: 18px; left: 3px; bottom: 3px;
  background: #fff; border-radius: 50%; transition: .2s;
  box-shadow: 0 1px 3px rgba(0,0,0,.15);
}
.toggle input:checked + .slider { background: #34c759; }
.toggle input:checked + .slider::before { transform: translateX(20px); }

/* Servo */
.servo-row { display: flex; gap: 8px; }
.servo-btn {
  flex: 1; padding: 10px; border: 1px solid #e5e5ea;
  border-radius: 10px; background: #f9f9fb;
  font-size: 13px; font-weight: 500; cursor: pointer;
  transition: all .15s; display: flex; align-items: center; justify-content: center; gap: 4px;
}
.servo-btn:hover { border-color: #007aff; background: #f0f5ff; }
.servo-btn:active { transform: scale(.97); }
.servo-btn.active { border-color: #34c759; background: #e8f8ee; color: #34c759; }

/* Sensor card */
.sensor-box {
  background: #f9f9fb;
  border-radius: 12px;
  padding: 14px;
  text-align: center;
}
.sensor-icon { font-size: 22px; margin-bottom: 4px; }
.sensor-label { font-size: 11px; color: #86868b; margin-bottom: 4px; }
.sensor-value { font-size: 20px; font-weight: 700; }
.sensor-value.green { color: #34c759; }
.sensor-value.blue { color: #007aff; }
.sensor-value.orange { color: #ff9500; }
.sensor-value.gray { color: #86868b; font-size: 13px; font-weight: 400; }
.sensor-bar {
  margin-top: 8px; height: 3px; background: #e5e5ea;
  border-radius: 3px; overflow: hidden;
}
.sensor-bar-fill { height: 100%; border-radius: 3px; transition: width .5s; }
.sensor-bar-fill.green { background: #34c759; }
.sensor-bar-fill.blue { background: #007aff; }

/* Empty */
.empty { text-align: center; padding: 80px 20px; }
.empty-icon { font-size: 48px; margin-bottom: 12px; opacity: .6; }
.empty-title { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
.empty-desc { color: #86868b; font-size: 14px; margin-bottom: 20px; }

/* Toast */
#toastBox {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  z-index: 999; pointer-events: none;
}
.toast {
  background: rgba(0,0,0,.8); backdrop-filter: blur(10px);
  color: #fff; padding: 10px 20px; border-radius: 10px;
  font-size: 13px; text-align: center;
  opacity: 0; transform: translateY(10px);
  transition: all .25s; margin-top: 6px;
}
.toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="header-left">
      <div class="header-logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      </div>
      <div>
        <div class="header-title">智慧控制面板</div>
        <div class="header-sub">Smart Control Center</div>
      </div>
    </div>
    <div class="header-right">
      <div class="conn-badge">
        <span class="conn-dot" id="connDot"></span>
        <span id="connLabel">连接中...</span>
      </div>
      <button class="btn btn-secondary btn-sm" onclick="scan()">扫描</button>
    </div>
  </div>
</div>

<div class="container">
  <div id="app">
    <div class="empty" id="emptyView">
      <div class="empty-icon">🌱</div>
      <div class="empty-title">暂无设备</div>
      <div class="empty-desc">未发现智能设备，点击扫描搜索</div>
      <button class="btn btn-primary" onclick="scan()">扫描设备</button>
    </div>
    <div id="deviceList"></div>
  </div>
</div>

<div id="toastBox"></div>

<script>
const token = localStorage.getItem('token');
if (!token) { window.location.href = '/'; }

const ws = new WebSocket((location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host + '?token=' + token);
const devs = {};
const LNAMES = ['西庭灯', '庭院灯带', '长廊灯'];
const LICONS = ['💡', '✨', '🌱'];

ws.onopen = () => {
  ws.send(JSON.stringify({ type: 'auth', token }));
  setConn(true);
  setTimeout(() => { ws.send(JSON.stringify({ type: 'init' })); setTimeout(scan, 1500); }, 200);
};
ws.onclose = () => setConn(false);
ws.onmessage = (e) => {
  try {
    const m = JSON.parse(e.data);
    if (m.type === 'device') {
      const old = devs[m.mac];
      devs[m.mac] = m.device;
      if (old && old.name === m.device.name) {
        updateSensorOnly(m.mac, m.device);
      } else {
        renderAll();
      }
    }
  } catch(_) {}
};

function setConn(ok) {
  document.getElementById('connDot').className = 'conn-dot' + (ok ? '' : ' off');
  document.getElementById('connLabel').textContent = ok ? '已连接' : '已断开';
}

function renderAll() {
  const keys = Object.keys(devs);
  const ev = document.getElementById('emptyView');
  const dl = document.getElementById('deviceList');
  ev.style.display = keys.length ? 'none' : '';
  dl.innerHTML = keys.length ? keys.map(m => cardHtml(m, devs[m])).join('') : '';
}

const DEVICE_LAYOUTS = {
  '智慧庭院': { type: 'garden', lights: 3, relays: 1, servos: 1 }
};

function cardHtml(mac, d) {
  const on = d.online;
  const layout = DEVICE_LAYOUTS[d.name];
  const isKnown = !!layout;
  const icon = isKnown ? '🌿' : '📟';

  let h = `<div class="card" id="c${mac}">
    <div class="card-header">
      <div class="card-info">
        <div class="card-avatar">${icon}</div>
        <div>
          <div class="card-name">${d.name}</div>
          <div class="card-meta"><span>ID ${d.device_id}</span><span>GPIO ${d.gpio_count}</span></div>
        </div>
      </div>
      <span class="status-badge ${on?'online':'offline'}">${on?'● 在线':'● 离线'}</span>
    </div>`;

  if (layout && layout.type === 'garden') {
    // Lights
    h += `<div class="section"><div class="section-title">💡 灯光</div><div class="grid-3">`;
    for (let i = 0; i < layout.lights; i++) {
      const v = d.gpio_states[i] || 0;
      h += `<div class="ctrl">
        <div><div class="ctrl-label">${LICONS[i]} ${LNAMES[i]}</div><div class="ctrl-status ${v?'on':'off'}">${v?'已开启':'已关闭'}</div></div>
        <label class="toggle"><input type="checkbox" ${v?'checked':''} onchange="setGpio('${mac}',${i},this.checked)"><span class="slider"></span></label>
      </div>`;
    }
    h += `</div></div>`;

    // Fan (relay at gpio_index 3)
    const fv = d.gpio_states[3] || 0;
    h += `<div class="section"><div class="section-title">🌀 风扇</div><div class="grid-2">
      <div class="ctrl">
        <div><div class="ctrl-label">🍃 风扇</div><div class="ctrl-status ${fv?'on':'off'}">${fv?'运行中':'已关闭'}</div></div>
        <label class="toggle"><input type="checkbox" ${fv?'checked':''} onchange="setRelay('${mac}',0,this.checked)"><span class="slider"></span></label>
      </div>
    </div></div>`;

    // Servo at gpio_index 6
    const sv = d.gpio_states[6] || 0;
    const hung = sv >= 180;
    h += `<div class="section"><div class="section-title">☔ 智能遮雨棚</div><div class="servo-row">
      <button class="servo-btn ${hung?'active':''}" onclick="setServo('${mac}',0,180)">展开遮雨</button>
      <button class="servo-btn ${!hung?'active':''}" onclick="setServo('${mac}',0,0)">收回遮雨棚</button>
    </div></div>`;
  } else {
    // Generic device — show all gpio_states as toggles
    const cnt = Math.min(d.gpio_count || 0, 16);
    if (cnt > 0) {
      h += `<div class="section"><div class="section-title">🔌 GPIO 控制</div><div class="grid-3">`;
      for (let i = 0; i < cnt; i++) {
        const v = d.gpio_states[i] || 0;
        h += `<div class="ctrl">
          <div><div class="ctrl-label">GPIO ${i}</div><div class="ctrl-status ${v?'on':'off'}">${v?'高':'低'}</div></div>
          <label class="toggle"><input type="checkbox" ${v?'checked':''} onchange="setGpio('${mac}',${i},this.checked)"><span class="slider"></span></label>
        </div>`;
      }
      h += `</div></div>`;
    }
  }

  // Sensors — auto-detected for any device
  const shtml = sensorHtml(d);
  if (shtml) {
    h += `<div class="section"><div class="section-title">📊 传感器</div><div class="grid-sensors" id="sg${mac}">${shtml}</div></div>`;
  }

  h += `</div>`;
  return h;
}

// Generic GPIO setter for any device
function setGpio(mac, idx, on) {
  const d = devs[mac]; if (!d) return;
  ws.send(JSON.stringify({type:'set_light',device_id:d.device_id,index:idx,value:on}));
  d.gpio_states[idx] = on ? 1 : 0;
  renderAll();
}

function sensorHtml(d) {
  const s = d.sensors || {};
  const soil = s.soil_mv !== undefined ? Math.min(100, Math.max(0, Math.round(s.soil_mv / 3100 * 100))) : -1;
  const light = s.light_mv !== undefined ? Math.min(100, Math.max(0, Math.round(s.light_mv / 3100 * 100))) : -1;
  const rain = s.rain_status !== undefined ? s.rain_status : -1;

  // 无传感器接入: ADC悬空噪声通常在10%以下, 全部低值=未接传感器
  const soilOk = soil >= 10;
  const lightOk = light >= 10;

  // 所有传感器都未接入, 不显示
  if (!soilOk && !lightOk && rain < 0) return '';

  let h = '';
  h += `<div class="sensor-box">
    <div class="sensor-icon">🌱</div>
    <div class="sensor-label">土壤湿度</div>
    ${soilOk ? `<div class="sensor-value green">${soil}%</div><div class="sensor-bar"><div class="sensor-bar-fill green" style="width:${soil}%"></div></div>` : `<div class="sensor-value gray" style="font-size:14px">未连接</div>`}
  </div>`;
  h += `<div class="sensor-box">
    <div class="sensor-icon">☀️</div>
    <div class="sensor-label">光照强度</div>
    ${lightOk ? `<div class="sensor-value blue">${light}%</div><div class="sensor-bar"><div class="sensor-bar-fill blue" style="width:${light}%"></div></div>` : `<div class="sensor-value gray" style="font-size:14px">未连接</div>`}
  </div>`;
  if (rain >= 0 && lightOk) {
    h += `<div class="sensor-box">
      <div class="sensor-icon">${rain === 1 ? '🌧️' : '☀️'}</div>
      <div class="sensor-label">雨滴状态</div>
      <div class="sensor-value" style="font-size:16px;color:${rain === 1 ? '#ff9500' : '#34c759'}">${rain === 1 ? '🌧️ 下雨中' : '☀️ 干燥'}</div>
    </div>`;
  } else {
    h += `<div class="sensor-box">
      <div class="sensor-icon">🌧️</div>
      <div class="sensor-label">雨滴传感器</div>
      <div class="sensor-value gray" style="font-size:14px">未连接</div>
    </div>`;
  }
  return h;
}

// Targeted sensor update — no full re-render
function updateSensorOnly(mac, d) {
  const sg = document.getElementById('sg' + mac);
  const shtml = sensorHtml(d);
  if (sg) {
    if (shtml) {
      sg.innerHTML = shtml;
    } else {
      const sec = sg.closest('.section');
      if (sec) sec.remove();
    }
  } else if (shtml) {
    renderAll();
  }
}

function setLight(mac, i, on) {
  const d = devs[mac]; if (!d) return;
  ws.send(JSON.stringify({type:'set_light',device_id:d.device_id,index:i,value:on}));
  d.gpio_states[i] = on ? 1 : 0;
  renderAll();
}

function setRelay(mac, i, on) {
  const d = devs[mac]; if (!d) return;
  ws.send(JSON.stringify({type:'set_relay',device_id:d.device_id,index:i,value:on}));
  d.gpio_states[3+i] = on ? 1 : 0;
  renderAll();
  toast(on ? '风扇已开启' : '风扇已关闭');
}

function setServo(mac, i, a) {
  const d = devs[mac]; if (!d) return;
  ws.send(JSON.stringify({type:'set_servo',device_id:d.device_id,index:i,angle:a}));
  d.gpio_states[6+i] = a;
  renderAll();
  toast(a >= 180 ? '遮雨棚已展开' : '遮雨棚已收回');
}

function scan() { ws.send(JSON.stringify({type:'discover'})); toast('正在扫描...'); }

function toast(msg) {
  const box = document.getElementById('toastBox');
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  box.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 250); }, 1800);
}
</script>
</body>
</html>
